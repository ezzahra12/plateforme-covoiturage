services:
  postgres:
    image: postgres:16
    container_name: covoiturage-db
    restart: always
    environment:
      POSTGRES_DB: covoiturage
      POSTGRES_USER: covoiturage_user
      POSTGRES_PASSWORD: covoiturage123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
