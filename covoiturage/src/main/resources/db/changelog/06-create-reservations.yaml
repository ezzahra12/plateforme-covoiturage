
databaseChangeLog:
  - changeSet:
      id: 06-create-reservations
      author: ezzahra

      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: nombre_places
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: montant_total
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: date_reservation
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: statut
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: passager_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: trajet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: point_monte_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: point_descente_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: passager_id
            referencedTableName: passagers
            referencedColumnNames: id
            constraintName: fk_reservations_passagers

        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: trajet_id
            referencedTableName: trajets
            referencedColumnNames: id
            constraintName: fk_reservations_trajets

        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: point_monte_id
            referencedTableName: points_arret
            referencedColumnNames: id
            constraintName: fk_reservations_point_monte

        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: point_descente_id
            referencedTableName: points_arret
            referencedColumnNames: id
            constraintName: fk_reservations_point_descente
