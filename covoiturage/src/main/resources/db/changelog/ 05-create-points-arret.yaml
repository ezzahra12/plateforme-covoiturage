
databaseChangeLog:
  - changeSet:
      id: 05-create-points-arret
      author: ezzahra

      changes:
        - createTable:
            tableName: points_arret
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: ville
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: ordre
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: heure_passage
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: prix_depuis_depart
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: trajet_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: points_arret
            baseColumnNames: trajet_id
            referencedTableName: trajets
            referencedColumnNames: id
            constraintName: fk_points_arret_trajets
